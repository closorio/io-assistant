<title>Tablero de hallazgos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85,600;100,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Mesa de guardia: cuatro columnas de igual peso; el nivel se lee por forma y color antes que por texto. */
:root {
  --bg: #eef1f4; --panel: #e2e7ec; --card: #fbfcfd; --line: #c6ced6; --fg: #17212b; --muted: #55626f; --accent: #1f5673;
  --rojo: #b3261e; --rojo-bg: #fbe9e7; --ambar: #8a5a00; --ambar-bg: #fdf0d5;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181e; --panel: #1a222a; --card: #232d37; --line: #3a4753; --fg: #e8edf1; --muted: #a0adb9; --accent: #7fb9d6;
  --rojo: #ff9d94; --rojo-bg: #4a1d1a; --ambar: #f2c063; --ambar-bg: #41310f; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12181e; --panel: #1a222a; --card: #232d37; --line: #3a4753; --fg: #e8edf1; --muted: #a0adb9; --accent: #7fb9d6;
  --rojo: #ff9d94; --rojo-bg: #4a1d1a; --ambar: #f2c063; --ambar-bg: #41310f; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--body); }
.pagina { display: grid; gap: 16px; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font: 600 26px/1.1 var(--display); font-stretch: 85%; text-wrap: balance; }
.resumen { margin: 4px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
label { color: var(--muted); font-size: 12px; }
select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filtro { display: flex; gap: 8px; align-items: center; }
#aviso { margin: 0; padding: 8px 12px; border: 1px solid var(--line); background: var(--ambar-bg); color: var(--fg); border-radius: 4px; }
.tablero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 960px) { .tablero { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tablero { grid-template-columns: minmax(0, 1fr); } }
.columna { background: var(--panel); border-radius: 6px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.columna.encima { outline: 2px dashed var(--accent); outline-offset: -2px; }
.columna h2 { margin: 0; font: 600 15px/1.2 var(--display); display: flex; justify-content: space-between; gap: 8px; }
.columna h2 span { font: 400 13px var(--mono); color: var(--muted); }
.vacia { margin: 0; color: var(--muted); font-size: 13px; }
.tarjeta { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.tarjeta[draggable="true"] { cursor: grab; }
.tarjeta h3 { margin: 0; font: 500 14px/1.3 var(--body); overflow-wrap: anywhere; }
.cliente { font: 400 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.chip { font-size: 12px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.chip.rojo { background: var(--rojo-bg); color: var(--rojo); border-color: transparent; font-weight: 500; }
.chip.ambar { background: var(--ambar-bg); color: var(--ambar); border-color: transparent; font-weight: 500; }
.dias { font: 400 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; color: var(--accent); font-size: 12px; }
details ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 3px; font-size: 13px; overflow-wrap: anywhere; }
details h4 { margin: 8px 0 0; font: 500 12px var(--body); color: var(--muted); }
.mover { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mover select { font-size: 12px; padding: 3px 4px; min-width: 0; }
</style>

<div class="pagina">
  <header>
    <div>
      <h1>Tablero de hallazgos</h1>
      <p class="resumen" id="resumen">Cargando las tarjetas del parte…</p>
    </div>
    <div class="filtro">
      <label for="filtro">Cliente</label>
      <select id="filtro"><option value="">Todos</option></select>
    </div>
  </header>
  <p id="aviso" role="status" aria-live="polite" hidden></p>
  <main class="tablero" id="tablero"></main>
</div>

<script>
const COLUMNAS = [["nuevos", "Nuevos"], ["en_curso", "En curso"], ["dejados", "Dejados de lado"], ["resueltos", "Resueltos"]];
const NOMBRE = Object.fromEntries(COLUMNAS);
const MARCAS = { automatica: "Se resolvió sola", reabierta: "Reabierta", empeorada: "Empeorada" };
const ORIGEN = { parte: "parte", voz: "voz", pagina: "página" };
const MAX_HISTORIAL = 20;

const tablero = document.getElementById("tablero");
const filtro = document.getElementById("filtro");
const resumen = document.getElementById("resumen");
const aviso = document.getElementById("aviso");

let tarjetas = [];
let puedeMover = true;
let baseDatos = null;
let cargada = false;
const abiertas = new Set();

function leerFiltro() { try { return localStorage.getItem("filtro") || ""; } catch { return ""; } }
function guardarFiltro(valor) { try { localStorage.setItem("filtro", valor); } catch {} }

function nodo(etiqueta, clase, texto) {
  const el = document.createElement(etiqueta);
  if (clase) el.className = clase;
  if (texto !== undefined) el.textContent = texto;
  return el;
}

function avisar(texto) {
  aviso.textContent = texto || "";
  aviso.hidden = !texto;
}

function hoy() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function diasAbierta(t) {
  const inicio = Date.parse(t.primera_vez);
  const fin = Date.parse(hoy());
  return Number.isNaN(inicio) ? null : Math.max(0, Math.round((fin - inicio) / 86400000));
}

function ordenar(lista) {
  return [...lista].sort((a, b) => (a.nivel === "rojo" ? 0 : 1) - (b.nivel === "rojo" ? 0 : 1) || String(a.primera_vez).localeCompare(String(b.primera_vez)));
}

async function mover(id, destino) {
  const t = tarjetas.find((x) => x.id === id);
  if (!t || t.columna === destino || !baseDatos) return;
  const linea = { fecha: hoy(), de: t.columna, a: destino, origen: "pagina" };
  try {
    await baseDatos.doc(`tarjetas/${id}`).update({
      columna: destino,
      marca: null,
      historial: [...(t.historial || []), linea].slice(-MAX_HISTORIAL),
    });
    avisar("");
  } catch (e) {
    avisar(`No se pudo mover «${t.titulo}». Sigue en ${NOMBRE[t.columna]}. Vuelve a intentarlo.`);
    pintar();
  }
}

function pintarTarjeta(t) {
  const el = nodo("article", "tarjeta");
  el.draggable = puedeMover;
  el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", t.id));

  el.append(nodo("div", "cliente", t.cliente || "global"), nodo("h3", "", t.titulo || t.check || t.id));

  const chips = nodo("div", "chips");
  if (t.nivel === "rojo") chips.append(nodo("span", "chip rojo", "■ Rojo"));
  if (t.nivel === "ambar") chips.append(nodo("span", "chip ambar", "▲ Ámbar"));
  if (MARCAS[t.marca]) chips.append(nodo("span", "chip", MARCAS[t.marca]));
  if (t.fiabilidad === "estimado") chips.append(nodo("span", "chip", "Estimado"));
  const dias = diasAbierta(t);
  if (dias !== null) chips.append(nodo("span", "dias", `${dias} d`));
  el.append(chips);

  const detalle = nodo("details");
  detalle.open = abiertas.has(t.id);
  detalle.addEventListener("toggle", () => { detalle.open ? abiertas.add(t.id) : abiertas.delete(t.id); });
  detalle.append(nodo("summary", "", "Detalle e historial"));
  const valores = nodo("ul");
  (t.detalle || []).forEach((v) => valores.append(nodo("li", "", v)));
  detalle.append(valores, nodo("h4", "", "Historial"));
  const historial = nodo("ul");
  [...(t.historial || [])].reverse().forEach((h) => {
    const de = h.de ? `${NOMBRE[h.de] || h.de} → ` : "";
    historial.append(nodo("li", "", `${h.fecha}: ${de}${NOMBRE[h.a] || h.a} (${ORIGEN[h.origen] || h.origen})`));
  });
  detalle.append(historial);
  el.append(detalle);

  if (puedeMover) {
    const fila = nodo("div", "mover");
    const idControl = `mover-${t.id}`;
    const etiqueta = nodo("label", "", "Mover a");
    etiqueta.htmlFor = idControl;
    const menu = nodo("select");
    menu.id = idControl;
    COLUMNAS.forEach(([valor, texto]) => {
      const opcion = nodo("option", "", texto);
      opcion.value = valor;
      opcion.selected = valor === t.columna;
      menu.append(opcion);
    });
    menu.addEventListener("change", () => mover(t.id, menu.value));
    fila.append(etiqueta, menu);
    el.append(fila);
  }
  return el;
}

function pintarColumna(valor, titulo, lista) {
  const col = nodo("section", "columna");
  const h2 = nodo("h2", "", titulo);
  h2.append(nodo("span", "", String(lista.length)));
  col.append(h2);
  if (!lista.length) col.append(nodo("p", "vacia", "Ninguna tarjeta"));
  ordenar(lista).forEach((t) => col.append(pintarTarjeta(t)));
  if (puedeMover) {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("encima"); });
    col.addEventListener("dragleave", () => col.classList.remove("encima"));
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      col.classList.remove("encima");
      mover(e.dataTransfer.getData("text/plain"), valor);
    });
  }
  return col;
}

function pintarFiltro() {
  const actual = filtro.value || leerFiltro();
  const clientes = [...new Set(tarjetas.map((t) => t.cliente || "global"))].sort();
  filtro.replaceChildren(Object.assign(nodo("option", "", "Todos"), { value: "" }));
  clientes.forEach((c) => filtro.append(Object.assign(nodo("option", "", c), { value: c })));
  filtro.value = clientes.includes(actual) ? actual : "";
}

function pintar() {
  pintarFiltro();
  const visibles = tarjetas.filter((t) => !filtro.value || (t.cliente || "global") === filtro.value);
  const activas = tarjetas.filter((t) => t.columna === "nuevos" || t.columna === "en_curso");
  const rojas = activas.filter((t) => t.nivel === "rojo").length;
  if (cargada) {
    const ultima = tarjetas.map((t) => t.ultima_vez).filter(Boolean).sort().pop();
    resumen.textContent = tarjetas.length
      ? `${activas.length} activas, ${rojas} en rojo. Último parte: ${ultima || "sin fecha"}.`
      : "Aún no hay tarjetas. Aparecerán cuando Ío dé el próximo parte.";
  }
  tablero.replaceChildren(...COLUMNAS.map(([valor, titulo]) => pintarColumna(valor, titulo, visibles.filter((t) => t.columna === valor))));
}

filtro.addEventListener("change", () => { guardarFiltro(filtro.value); pintar(); });
pintar();

(async () => {
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  puedeMover = user ? user.isOwner() : true;
  if (!db) {
    puedeMover = false;
    resumen.textContent = "Esta vista no puede leer las tarjetas.";
    avisar("No se puede saber el estado de los hallazgos desde aquí. Abre la página con tu cuenta de Claude.");
    pintar();
    return;
  }
  baseDatos = db;
  const espera = setTimeout(() => {
    avisar(cargada ? "Las tarjetas pueden no estar al día: no llega respuesta." : "Las tarjetas no cargan todavía. Esto no significa que no haya hallazgos.");
  }, 10000);
  db.collection("tarjetas").onSnapshot((snap) => {
    tarjetas = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    if (!snap.metadata.fromCache) {
      cargada = true;
      clearTimeout(espera);
      avisar("");
    }
    pintar();
  }, () => {
    clearTimeout(espera);
    puedeMover = false;
    avisar("Se perdió la conexión con las tarjetas. Recarga la página para verlas al día.");
    pintar();
  });
})();
</script>
